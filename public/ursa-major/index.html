<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Undead Ursa Major · Heavy Walk</title><style>
body{margin:0;background:#111b19;color:#e6dfcc;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{text-align:center;max-width:720px;padding:24px}h1{font-size:25px}p{color:#a4b5a8;line-height:1.5}canvas{width:100%;max-width:640px;image-rendering:pixelated}button,a{background:#30463b;border:1px solid #79907c;color:inherit;border-radius:6px;padding:10px 16px;margin:5px;cursor:pointer}a{display:inline-block;text-decoration:none}
</style><main><h1>Undead Ursa Major</h1><p>Heavy paw steps · Shoulder weight shift · Low sword sway</p>
<canvas width="640" height="440"></canvas><div><button id="pause">Pause</button><button id="face">Face right</button><button id="slow">Half speed</button><button id="step">Next frame</button><button id="design">Character design</button><a href="../">Play game</a></div><p id="stage">Walking</p></main>
<script type="module">
const meta=await(await fetch('./Ursa-major.json')).json(),walk=new Image(),base=new Image();walk.src='./Ursa-major-walk-spritesheet.png';base.src='./Ursa-major-undead.png';await Promise.all([walk.decode(),base.decode()]);
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),clip=meta.walk,duration=clip.durationsMs.reduce((a,b)=>a+b,0);
let elapsed=0,last=performance.now(),paused=false,face=-1,rate=1,design=false;
function frameAt(ms){let f=0;while(f<clip.frameCount-1&&ms>=clip.durationsMs[f])ms-=clip.durationsMs[f++];return f;}
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';};
document.querySelector('#face').onclick=e=>{face*=-1;e.target.textContent=face<0?'Face right':'Face left';};
document.querySelector('#slow').onclick=e=>{rate=rate===1?.5:1;e.target.textContent=rate===1?'Half speed':'Normal speed';};
document.querySelector('#design').onclick=e=>{design=!design;e.target.textContent=design?'Walk cycle':'Character design';};
document.querySelector('#step').onclick=()=>{paused=true;design=false;document.querySelector('#pause').textContent='Play';document.querySelector('#design').textContent='Character design';const f=(frameAt(elapsed)+1)%clip.frameCount;elapsed=clip.durationsMs.slice(0,f).reduce((a,b)=>a+b,0)+.1;};
window.ursaPreview={seek(f){paused=true;design=false;elapsed=clip.durationsMs.slice(0,f).reduce((a,b)=>a+b,0)+.1;document.querySelector('#pause').textContent='Play';}};
function draw(now){const dt=Math.min(now-last,50);last=now;if(!paused&&!design)elapsed=(elapsed+dt*rate)%duration;
 ctx.clearRect(0,0,640,440);ctx.fillStyle='#30443a';ctx.fillRect(28,391,584,2);const f=frameAt(elapsed),c=design?meta.base:null;
 const rect=c?c.rect:clip.frameRects[f],[x,y,w,h]=rect,ax=c?c.anchorX:clip.frameAnchorX[f],gy=c?c.groundY:clip.frameGroundY[f],scale=280/(c?c.bodyHeight:clip.bodyHeight);
 ctx.save();ctx.translate(320,390);ctx.scale(face*scale,scale);ctx.imageSmoothingEnabled=false;ctx.drawImage(design?base:walk,x,y,w,h,-ax,-gy,w,h);ctx.restore();
 canvas.dataset.frame=String(f);canvas.dataset.facing=String(face);document.querySelector('#stage').textContent=design?'Approved undead design':`Heavy walk · ${f+1} / ${clip.frameCount}`;requestAnimationFrame(draw);
}requestAnimationFrame(draw);
</script></html>
