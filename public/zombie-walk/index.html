<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standard Zombie · Animations</title>
<style>
body{margin:0;background:#111b19;color:#e6dfcc;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{text-align:center;max-width:680px;padding:24px}h1{font-size:24px;margin:0}p{color:#a4b5a8;line-height:1.5}canvas{width:100%;max-width:640px;image-rendering:pixelated}button{background:#30463b;border:1px solid #79907c;color:inherit;border-radius:6px;padding:10px 18px;margin:6px;cursor:pointer}
</style>
<main><h1>Standard Zombie</h1><p>Walk · Hit recoil · Two alternating deaths · Ember burn to ash · Radiant impact · Stoneshard wounds</p>
<canvas width="640" height="380"></canvas><div><button id="pause">Pause</button><button id="face">Face right</button><button id="hit">Hit Zombie</button><button id="kill">Kill Zombie</button><button id="burn">Ember death</button><button id="radiant">Radiant death</button><button id="stone-hit">Stoneshard hit</button><button id="stone-death">Stoneshard death</button></div>
<p id="stage">Walking</p></main>
<script type="module">
const meta=await(await fetch('./Zombie-walk.json')).json(),img=new Image();
img.src='./Zombie-walk-spritesheet.png';await img.decode();
const hitMeta=await(await fetch('../zombie-hit/Zombie-hit.json')).json(),hitImg=new Image();
hitImg.src='../zombie-hit/Zombie-hit-spritesheet.png';await hitImg.decode();
const fallMeta=await(await fetch('../zombie-fall/Zombie-fall.json')).json(),fallImg=new Image();
fallImg.src='../zombie-fall/Zombie-fall-spritesheet.png';await fallImg.decode();
const boneMeta=await(await fetch('../zombie-decompose/Zombie-decompose.json')).json(),boneImg=new Image();
boneImg.src='../zombie-decompose/Zombie-decompose-spritesheet.png';await boneImg.decode();
const severedFallMeta=await(await fetch('../zombie-severed-fall/Zombie-severed-fall.json')).json(),severedFallImg=new Image();
severedFallImg.src='../zombie-severed-fall/Zombie-severed-fall-spritesheet.png';await severedFallImg.decode();
const severedBoneMeta=await(await fetch('../zombie-severed-decompose/Zombie-severed-decompose.json')).json(),severedBoneImg=new Image();
severedBoneImg.src='../zombie-severed-decompose/Zombie-severed-decompose-spritesheet.png';await severedBoneImg.decode();
const igniteMeta=await(await fetch('../zombie-burn-ignite/Zombie-burn-ignite.json')).json(),igniteImg=new Image();
igniteImg.src='../zombie-burn-ignite/Zombie-burn-ignite-spritesheet.png';await igniteImg.decode();
const ashMeta=await(await fetch('../zombie-burn-out/Zombie-burn-out.json')).json(),ashImg=new Image();
ashImg.src='../zombie-burn-out/Zombie-burn-out-spritesheet.png';await ashImg.decode();
const radiantMeta=await(await fetch('../zombie-radiant-fall/Zombie-radiant-fall.json')).json(),radiantImg=new Image();
radiantImg.src='../zombie-radiant-fall/Zombie-radiant-fall-spritesheet.png';await radiantImg.decode();
const stoneMeta=await(await fetch('../zombie-stones/Zombie-stones.json')).json(),stoneImg=new Image();
stoneImg.src='../zombie-stones/Zombie-stones-spritesheet.png';await stoneImg.decode();
const ctx=document.querySelector('canvas').getContext('2d'),duration=meta.durationsMs.reduce((a,b)=>a+b,0);
const hitDuration=hitMeta.durationsMs.reduce((a,b)=>a+b,0);
let elapsed=0,last=performance.now(),paused=false,face=-1,hitElapsed=null,deathElapsed=null,nextSevered=false,severed=false,burning=false,radiant=false,stoneDeath=false,stoneElapsed=null;
document.querySelector('#hit').onclick=()=>{if(deathElapsed===null)hitElapsed=0};
document.querySelector('#kill').onclick=()=>{if(deathElapsed!==null)return;stoneDeath=false;burning=radiant=false;severed=nextSevered;nextSevered=!nextSevered;deathElapsed=0;hitElapsed=null};
document.querySelector('#burn').onclick=()=>{if(deathElapsed!==null)return;stoneDeath=false;radiant=false;burning=true;deathElapsed=0;hitElapsed=null};
document.querySelector('#radiant').onclick=()=>{if(deathElapsed!==null)return;stoneDeath=false;burning=false;radiant=true;deathElapsed=0;hitElapsed=null};
document.querySelector('#stone-hit').onclick=()=>{if(deathElapsed===null){stoneElapsed=0;hitElapsed=0}};
document.querySelector('#stone-death').onclick=()=>{if(deathElapsed!==null)return;burning=radiant=severed=false;stoneDeath=true;stoneElapsed=0;deathElapsed=0;hitElapsed=null};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};
document.querySelector('#face').onclick=e=>{face*=-1;e.target.textContent=face<0?'Face right':'Face left'};
function frameAt(clip,time){let frame=0;while(frame<clip.frameCount-1&&time>=clip.durationsMs[frame])time-=clip.durationsMs[frame++];return frame}
function pose(clip,sheet,frame,alpha=1,bodyHeight=clip.bodyHeight){ctx.save();ctx.globalAlpha=alpha;ctx.translate(320,330);ctx.scale(face*230/bodyHeight,230/bodyHeight);ctx.imageSmoothingEnabled=false;
const [x,y,w,h]=clip.frameRects?.[frame]??[frame%clip.columns*clip.frameWidth,Math.floor(frame/clip.columns)*clip.frameHeight,clip.frameWidth,clip.frameHeight];
ctx.drawImage(sheet,x,y,w,h,-clip.frameAnchorX[frame],-clip.frameGroundY[frame],w,h);
const key=sheet.src.split('/').at(-1).replace('Zombie-','zombie-').replace('-spritesheet.png',''),torso=stoneMeta.torsos[key]?.[frame];
if(stoneElapsed!==null&&torso){const [sx,sy,wx,wy]=torso,rotation=Math.atan2(sy-wy,sx-wx)+Math.PI/2;
 for(let i=0;i<5;i++){const remaining=Math.max(0,Math.min(1,(5.15+i*.55-stoneElapsed)/.65))*(deathElapsed===null?1:Math.max(0,Math.min(1,((burning?2800:2080)-deathElapsed)/250)));if(!remaining)continue;
  const t=[.08,.34,.60,.87,1.18][i],inset=[-8,6,-5,5,-2][i],j=i%4,size=stoneMeta.frameSize,[ox,oy]=stoneMeta.origins[j];
  ctx.save();ctx.globalAlpha=alpha*remaining;ctx.translate(sx+(wx-sx)*t+Math.cos(rotation)*inset-clip.frameAnchorX[frame],sy+(wy-sy)*t+Math.sin(rotation)*inset-clip.frameGroundY[frame]);
  ctx.rotate(rotation+[-.12,.09,-.08,.16,-.1][i]);ctx.scale([.078,.067,.086,.071,.062][i],[.078,.067,.086,.071,.062][i]);
  ctx.drawImage(stoneImg,j%2*size,Math.floor(j/2)*size,size,size,-ox,-oy,size,size);ctx.restore();
 }}ctx.restore()}
function draw(now){const dt=Math.min(now-last,50);last=now;if(!paused){if(deathElapsed!==null){deathElapsed+=dt;if(deathElapsed>=(burning?4900:4180)){deathElapsed=null;stoneElapsed=null}}else if(hitElapsed!==null){hitElapsed+=dt;if(hitElapsed>=hitDuration)hitElapsed=null}else elapsed+=dt}
if(!paused&&deathElapsed===null&&stoneElapsed!==null){stoneElapsed+=dt/1000;if(stoneElapsed>=7.35)stoneElapsed=null}
ctx.clearRect(0,0,640,380);ctx.fillStyle='#263d32';ctx.fillRect(25,331,590,2);
let stage='Walking';
if(deathElapsed!==null&&burning){const t=deathElapsed;
 stage='Ember death · '+(t<200?'Chest burn':t<800?'Flames spreading':t<1200?'Engulfed':t<2800?'Burning to ash':t<4300?'Ash':'Fading away');
 if(t<1200)pose(igniteMeta,igniteImg,frameAt(igniteMeta,t));
 else if(t<1380){const mix=(t-1200)/180;pose(igniteMeta,igniteImg,5,1-mix);pose(ashMeta,ashImg,0,mix)}
 else{const position=Math.min(1,(t-1380)/1420)*5,frame=Math.floor(position),mix=position-frame,alpha=1-Math.max(0,(t-4300)/600);pose(ashMeta,ashImg,frame,alpha*(1-mix));if(frame<5)pose(ashMeta,ashImg,frame+1,alpha*mix)}
}else if(deathElapsed!==null){const t=deathElapsed;stage=t<700?'Falling':t<880?'Settling':t<2080?'Fading to bones':t<3580?'Bones':'Fading away';
 const fm=radiant?radiantMeta:severed?severedFallMeta:fallMeta,fi=radiant?radiantImg:severed?severedFallImg:fallImg,bm=!radiant&&severed?severedBoneMeta:boneMeta,bi=!radiant&&severed?severedBoneImg:boneImg;
 const boneHeight=radiant?fm.bodyHeight:bm.bodyHeight;
 stage=(stoneDeath?'Stoneshard death · ':radiant?'Radiant death · ':severed?'Severed death · ':'Normal death · ')+stage;
 if(t<700)pose(fm,fi,frameAt(fm,t));
 else if(t<880){const mix=(t-700)/180;pose(fm,fi,5,1-mix);pose(bm,bi,0,mix,boneHeight)}
 else{const position=Math.min(1,(t-880)/1200)*5,frame=Math.floor(position),mix=position-frame,alpha=1-Math.max(0,(t-3580)/600);pose(bm,bi,frame,alpha*(1-mix),boneHeight);if(frame<5)pose(bm,bi,frame+1,alpha*mix,boneHeight)}
}else{const clip=hitElapsed===null?meta:hitMeta;pose(clip,hitElapsed===null?img:hitImg,frameAt(clip,hitElapsed??(elapsed%duration)));if(hitElapsed!==null)stage='Recoiling'}
if(stoneElapsed!==null&&deathElapsed===null)stage+=' · Embedded shards';
document.querySelector('#stage').textContent=stage;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
