<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standard Zombie · Animations</title>
<style>
body{margin:0;background:#111b19;color:#e6dfcc;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{text-align:center;max-width:680px;padding:24px}h1{font-size:24px;margin:0}p{color:#a4b5a8;line-height:1.5}canvas{width:100%;max-width:640px;image-rendering:pixelated}button{background:#30463b;border:1px solid #79907c;color:inherit;border-radius:6px;padding:10px 18px;margin:6px;cursor:pointer}
</style>
<main><h1>Standard Zombie</h1><p>Walk · Hit recoil · Fall and fade to bones</p>
<canvas width="640" height="380"></canvas><div><button id="pause">Pause</button><button id="face">Face right</button><button id="hit">Hit Zombie</button><button id="kill">Kill Zombie</button></div>
<p id="stage">Walking</p></main>
<script type="module">
const meta=await(await fetch('./Zombie-walk.json')).json(),img=new Image();
img.src='./Zombie-walk-spritesheet.png';await img.decode();
const hitMeta=await(await fetch('../zombie-hit/Zombie-hit.json')).json(),hitImg=new Image();
hitImg.src='../zombie-hit/Zombie-hit-spritesheet.png';await hitImg.decode();
const fallMeta=await(await fetch('../zombie-fall/Zombie-fall.json')).json(),fallImg=new Image();
fallImg.src='../zombie-fall/Zombie-fall-spritesheet.png';await fallImg.decode();
const boneMeta=await(await fetch('../zombie-decompose/Zombie-decompose.json')).json(),boneImg=new Image();
boneImg.src='../zombie-decompose/Zombie-decompose-spritesheet.png';await boneImg.decode();
const ctx=document.querySelector('canvas').getContext('2d'),duration=meta.durationsMs.reduce((a,b)=>a+b,0);
const hitDuration=hitMeta.durationsMs.reduce((a,b)=>a+b,0);
let elapsed=0,last=performance.now(),paused=false,face=-1,hitElapsed=null,deathElapsed=null;
document.querySelector('#hit').onclick=()=>{if(deathElapsed===null)hitElapsed=0};
document.querySelector('#kill').onclick=()=>{deathElapsed=0;hitElapsed=null};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};
document.querySelector('#face').onclick=e=>{face*=-1;e.target.textContent=face<0?'Face right':'Face left'};
function frameAt(clip,time){let frame=0;while(frame<clip.frameCount-1&&time>=clip.durationsMs[frame])time-=clip.durationsMs[frame++];return frame}
function pose(clip,sheet,frame,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.translate(320,330);ctx.scale(face*230/clip.bodyHeight,230/clip.bodyHeight);ctx.imageSmoothingEnabled=false;
ctx.drawImage(sheet,frame%clip.columns*clip.frameWidth,Math.floor(frame/clip.columns)*clip.frameHeight,clip.frameWidth,clip.frameHeight,-clip.frameAnchorX[frame],-clip.frameGroundY[frame],clip.frameWidth,clip.frameHeight);ctx.restore()}
function draw(now){const dt=Math.min(now-last,50);last=now;if(!paused){if(deathElapsed!==null){deathElapsed+=dt;if(deathElapsed>=4180)deathElapsed=null}else if(hitElapsed!==null){hitElapsed+=dt;if(hitElapsed>=hitDuration)hitElapsed=null}else elapsed+=dt}
ctx.clearRect(0,0,640,380);ctx.fillStyle='#263d32';ctx.fillRect(25,331,590,2);
let stage='Walking';
if(deathElapsed!==null){const t=deathElapsed;stage=t<700?'Falling':t<880?'Settling':t<2080?'Fading to bones':t<3580?'Bones':'Fading away';
 if(t<700)pose(fallMeta,fallImg,frameAt(fallMeta,t));
 else if(t<880){const mix=(t-700)/180;pose(fallMeta,fallImg,5,1-mix);pose(boneMeta,boneImg,0,mix)}
 else{const position=Math.min(1,(t-880)/1200)*5,frame=Math.floor(position),mix=position-frame,alpha=1-Math.max(0,(t-3580)/600);pose(boneMeta,boneImg,frame,alpha*(1-mix));if(frame<5)pose(boneMeta,boneImg,frame+1,alpha*mix)}
}else{const clip=hitElapsed===null?meta:hitMeta;pose(clip,hitElapsed===null?img:hitImg,frameAt(clip,hitElapsed??(elapsed%duration)));if(hitElapsed!==null)stage='Recoiling'}
document.querySelector('#stage').textContent=stage;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
